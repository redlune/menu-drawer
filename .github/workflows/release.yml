name: Release Menu Drawer

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: menu-drawer-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'redlune/menu-drawer' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and sign the DMG and appcast
        id: package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          output="$(bash scripts/package-update.sh)"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          printf 'directory=%s\nversion=%s\n' "$output" "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: menu-drawer-release-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.directory }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/publish-update.sh release "$RELEASE_VERSION" "$GITHUB_SHA"
